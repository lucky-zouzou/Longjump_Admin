services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      LOONGJUMP_ORIGIN: ${LOONGJUMP_ORIGIN:?Set public HTTPS origin}
      LOONGJUMP_ADMIN_ID: ${LOONGJUMP_ADMIN_ID:-company-admin}
      LOONGJUMP_ADMIN_EMAIL: ${LOONGJUMP_ADMIN_EMAIL:?Set administrator email}
      LOONGJUMP_ADMIN_NAME: ${LOONGJUMP_ADMIN_NAME:-公司管理员}
      LOONGJUMP_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      LOONGJUMP_BACKUP_RETENTION_DAYS: 30
    secrets:
      - admin_password
    volumes:
      - company_data:/data
      - company_backups:/backups
secrets:
  admin_password:
    file: ./secrets/admin_password.txt
volumes:
  company_data:
  company_backups:
