name: PR38 release recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-refs/heads/main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure existing deployment connection
        env:
          DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/known_hosts << 'EOF'
          47.238.71.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjWaG0bPAUFRiDNga4FHhCCZ81mDLc0UwYiD69dmfOE
          EOF
      - name: Verify current data backup before migration
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 root@47.238.71.113 \
            'cd /root/loong-jump-v17 && docker compose exec -T app node server/cli.mjs backup --output /backups/pre-d6388b234a8d45f8c885e36f2eada84b2a6dc94b-recovery-${{ github.run_id }}.tar'
      - name: Activate the already verified PR38 release image
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 root@47.238.71.113 \
            'cd /root/loong-jump-v17 && bash scripts/activate-release.sh d6388b234a8d45f8c885e36f2eada84b2a6dc94b ${{ github.run_id }}'
      - name: Verify published release health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 https://admin.loongjump.com/healthz | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{const r=JSON.parse(s);if(r.ok!==true||r.release!=='d6388b234a8d45f8c885e36f2eada84b2a6dc94b')process.exit(1);console.log(JSON.stringify(r));})"; then exit 0; fi
            sleep 10
          done
          exit 1
