name: Recover verified production release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-refs/heads/main
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        run: |
          test -n "${{ secrets.SSH_DEPLOY_KEY }}" || { echo "ERROR: SSH_DEPLOY_KEY secret is empty or missing" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "ERROR: SSH_DEPLOY_KEY is not a valid private key (check for lost line breaks)" >&2; exit 1; }
          cat >> ~/.ssh/known_hosts << 'EOF'
          47.238.71.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjWaG0bPAUFRiDNga4FHhCCZ81mDLc0UwYiD69dmfOE
          EOF
          cat > ~/.ssh/config << 'EOF'
          Host 47.238.71.113
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            StrictHostKeyChecking yes
          EOF

      - name: Verify completed backup and activate the tested release
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 'bash -s' -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          attempt=$1
          release=5647c055a2a5effce3664204bc89d97eff505882
          cd /root/loong-jump-v17
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' loong-jump-v17-app-1 | grep -Fxq 'LOONGJUMP_RELEASE=6b7fd2dc449150a2afa0a287c2fe87afa2689b7a'
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "loongjump-release:$release" | grep -Fxq "LOONGJUMP_RELEASE=$release"
          printf '%s\n' '9a3cb0297cf4c6f79dcfd0d4667f0e75a2905ec7e54a2e7f876bc060ada3d820  scripts/activate-release.sh' | sha256sum -c -
          docker compose exec -T app node server/cli.mjs verify --input /backups/pre-5647c055a2a5effce3664204bc89d97eff505882-recovery-44264931206.tar </dev/null
          bash scripts/activate-release.sh "$release" "$attempt" </dev/null
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' loong-jump-v17-app-1 | grep '^LOONGJUMP_RELEASE='
          df -h /
          REMOTE
      - name: Verify the exact production release
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 https://admin.loongjump.com/healthz | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r.get("ok") is True and r.get("release")=="5647c055a2a5effce3664204bc89d97eff505882" else 1)'; then
              echo 'Expected release is healthy'
              exit 0
            fi
            sleep 5
          done
          echo 'Expected release did not become healthy'; exit 1
