name: Inspect production storage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          test -n "${{ secrets.SSH_DEPLOY_KEY }}" || { echo "ERROR: SSH_DEPLOY_KEY secret is empty or missing" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "ERROR: SSH_DEPLOY_KEY is not a valid private key (check for lost line breaks)" >&2; exit 1; }
          cat >> ~/.ssh/known_hosts << 'EOF'
          47.238.71.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjWaG0bPAUFRiDNga4FHhCCZ81mDLc0UwYiD69dmfOE
          EOF
          cat > ~/.ssh/config << 'EOF'
          Host 47.238.71.113
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            StrictHostKeyChecking yes
          EOF

      - name: Read production storage metadata
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 'bash -s' <<'REMOTE'
          set -eu
          df -h /
          df -i /
          docker system df
          cd /root/loong-jump-v17
          du -xhd1 /root/loong-jump-v17 /var/lib/docker 2>/dev/null | sort -h
          docker inspect loong-jump-v17-app-1 --format '{{range .Mounts}}{{println .Source " -> " .Destination}}{{end}}'
          bash scripts/cleanup-images.sh
          REMOTE
