name: Inspect storage cleanup candidates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-refs/heads/main
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          test -n "${{ secrets.SSH_DEPLOY_KEY }}" || { echo "ERROR: SSH_DEPLOY_KEY secret is empty or missing" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "ERROR: SSH_DEPLOY_KEY is not a valid private key (check for lost line breaks)" >&2; exit 1; }
          cat >> ~/.ssh/known_hosts << 'EOF'
          47.238.71.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjWaG0bPAUFRiDNga4FHhCCZ81mDLc0UwYiD69dmfOE
          EOF
          cat > ~/.ssh/config << 'EOF'
          Host 47.238.71.113
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            StrictHostKeyChecking yes
          EOF

      - name: Inspect storage and backup inventory without changing data
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 'python3 -' <<'REMOTE'
          import os,json,subprocess,time,stat
          from pathlib import Path
          def run(args):
              p=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              print(json.dumps({'command':args,'code':p.returncode,'output':p.stdout},ensure_ascii=False))
          run(['date','-u','+%Y-%m-%dT%H:%M:%SZ'])
          run(['df','-h','/'])
          run(['docker','system','df'])
          run(['du','-xhd1','/root','/var','/tmp','/var/cache','/var/log'])
          run(['docker','ps','-a','--format','{{.Names}} | {{.Status}} | {{.Image}}'])
          run(['docker','image','ls','--format','{{.Repository}}:{{.Tag}} | {{.ID}} | {{.Size}}'])
          run(['journalctl','--disk-usage'])
          run(['docker','exec','loong-jump-v17-app-1','sh','-c','printenv | grep -E "^LOONGJUMP_BACKUP_(RETENTION_DAYS|MONTHLY_KEEP_MONTHS)=" || true'])
          root=Path('/root/loong-jump-v17/backups')
          rows=[]
          for p in sorted(root.iterdir()):
              st=p.lstat()
              rows.append({'name':p.name,'bytes':st.st_size,'mtime':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime(st.st_mtime)),'regular':stat.S_ISREG(st.st_mode),'symlink':p.is_symlink()})
          print(json.dumps({'backup_inventory':rows},ensure_ascii=False))
          for path in ['/root/loong-jump-v17/release-images','/root/.cache','/root/.npm','/var/cache/apt/archives']:
              root=Path(path)
              if root.exists():
                  run(['du','-xhd1',path])
          REMOTE
