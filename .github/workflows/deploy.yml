name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build production image on GitHub
        timeout-minutes: 20
        run: |
          docker build --build-arg LOONGJUMP_RELEASE=${{ github.sha }} \
            -t loongjump-release:${{ github.sha }} .
          docker save loongjump-release:${{ github.sha }} | gzip -1 > "$RUNNER_TEMP/app-image.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum app-image.tar.gz > app-image.tar.gz.sha256)

      - name: Setup SSH
        run: |
          test -n "${{ secrets.SSH_DEPLOY_KEY }}" || { echo "ERROR: SSH_DEPLOY_KEY secret is empty or missing" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "ERROR: SSH_DEPLOY_KEY is not a valid private key (check for lost line breaks)" >&2; exit 1; }
          cat >> ~/.ssh/known_hosts << 'EOF'
          47.238.71.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjWaG0bPAUFRiDNga4FHhCCZ81mDLc0UwYiD69dmfOE
          EOF
          cat > ~/.ssh/config << 'EOF'
          Host 47.238.71.113
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            StrictHostKeyChecking yes
          EOF

      - name: Upload source to server
        run: |
          tar \
            --exclude='./.git' --exclude='./node_modules' --exclude='./.wrangler' \
            --exclude='./dist-node' --exclude='./dist' --exclude='./secrets' --exclude='./backups' --exclude='./data' \
            --exclude='./.env' --exclude='./Caddyfile' --exclude='./compose.yaml' \
            --exclude='./.github' \
            -czf - . | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o BatchMode=yes -o PreferredAuthentications=publickey \
            root@47.238.71.113 'cd /root/loong-jump-v17 && tar -xzf -'

      - name: Upload and verify prebuilt image
        timeout-minutes: 15
        run: |
          image_dir=/root/loong-jump-v17/release-images/${{ github.sha }}-${{ github.run_attempt }}
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 "mkdir -p '$image_dir'"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "$RUNNER_TEMP/app-image.tar.gz" "$RUNNER_TEMP/app-image.tar.gz.sha256" \
            "root@47.238.71.113:$image_dir/"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 \
            "cd '$image_dir' && sha256sum -c app-image.tar.gz.sha256 && docker load -i app-image.tar.gz && rm -- app-image.tar.gz app-image.tar.gz.sha256"

      - name: Back up current data before migration
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 \
            'cd /root/loong-jump-v17 && docker compose exec -T app node server/cli.mjs backup --output /backups/pre-${{ github.sha }}-${{ github.run_attempt }}.tar'

      - name: Activate verified image without compiling on production
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            root@47.238.71.113 \
            'cd /root/loong-jump-v17 && bash scripts/activate-release.sh ${{ github.sha }} ${{ github.run_attempt }}'

      - name: Wait for healthy
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        timeout-minutes: 6
        run: |
          for i in $(seq 1 30); do
            status=$(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 \
              "docker inspect --format '{{.State.Running}} {{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' loong-jump-v17-app-1")
            case "$status" in
              "true healthy")
                curl --fail --silent --show-error --max-time 15 https://admin.loongjump.com/healthz | \
                  node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{const r=JSON.parse(s);if(r.ok!==true||r.release!==process.env.EXPECTED_RELEASE)process.exit(1)})"
                exit 0 ;;
              "false "*|"true unhealthy") echo "container failed: $status" >&2; exit 1 ;;
            esac
            echo "waiting for healthy... ($status)"
            sleep 10
          done
          echo "healthcheck timeout" >&2
          exit 1
