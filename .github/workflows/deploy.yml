name: PR38 release recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-refs/heads/main
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure existing deployment connection
        env:
          DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/known_hosts << 'EOF'
          47.238.71.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjWaG0bPAUFRiDNga4FHhCCZ81mDLc0UwYiD69dmfOE
          EOF
      - name: Read disk use and protected release images
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 root@47.238.71.113 'bash -s' << 'REMOTE'
          set -eu
          df -h /
          df -i /
          docker system df
          du -sh /var/lib/docker /root/loong-jump-v17/data /root/loong-jump-v17/backups /root/loong-jump-v17/release-images
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
          cd /root/loong-jump-v17
          bash scripts/cleanup-images.sh
          REMOTE
