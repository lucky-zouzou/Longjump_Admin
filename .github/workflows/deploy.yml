name: Apply approved backup cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-refs/heads/main
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          test -n "${{ secrets.SSH_DEPLOY_KEY }}" || { echo "ERROR: SSH_DEPLOY_KEY secret is empty or missing" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "ERROR: SSH_DEPLOY_KEY is not a valid private key (check for lost line breaks)" >&2; exit 1; }
          cat >> ~/.ssh/known_hosts << 'EOF'
          47.238.71.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjWaG0bPAUFRiDNga4FHhCCZ81mDLc0UwYiD69dmfOE
          EOF
          cat > ~/.ssh/config << 'EOF'
          Host 47.238.71.113
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            StrictHostKeyChecking yes
          EOF

      - name: Recheck the exact approved file set
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 \
            'python3 - --plan /root/loong-jump-v17/storage-cleanup/plan-20261118.json --approved-sha256 fae46d21d4b6654738bf3d1fe9891fa1e43e023df7661fef5030a34e0fd2b6e1' \
            < scripts/apply-approved-backup-cleanup.py
      - name: Remove only the 11 user-approved older release backups
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 \
            'python3 - --plan /root/loong-jump-v17/storage-cleanup/plan-20261118.json --approved-sha256 fae46d21d4b6654738bf3d1fe9891fa1e43e023df7661fef5030a34e0fd2b6e1 --apply' \
            < scripts/apply-approved-backup-cleanup.py
      - name: Verify remaining space and service health
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 \
            'df -B1 / && docker ps --format "{{.Names}} | {{.Status}}" && find /root/loong-jump-v17/backups -maxdepth 1 -type f -name "*.tar" -printf "%f %s bytes\n"'
          curl --fail --silent --show-error --max-time 20 https://admin.loongjump.com/healthz
