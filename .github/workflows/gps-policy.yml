name: Inspect GPS proxy policy
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/gps-policy.yml']
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          test -n "${{ secrets.SSH_DEPLOY_KEY }}" || { echo "ERROR: SSH_DEPLOY_KEY secret is empty or missing" >&2; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "ERROR: SSH_DEPLOY_KEY is not a valid private key (check for lost line breaks)" >&2; exit 1; }
          cat >> ~/.ssh/known_hosts << 'EOF'
          47.238.71.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjWaG0bPAUFRiDNga4FHhCCZ81mDLc0UwYiD69dmfOE
          EOF

      - name: Inspect proxy configuration without business data
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes root@47.238.71.113 'bash -s' <<'REMOTE'
          set -eu
          docker ps --format '{{.Names}} {{.Image}}' | grep -i caddy || true
          command -v caddy || true
          for f in /etc/caddy/Caddyfile /root/loong-jump-v17/Caddyfile; do
            if test -f "$f"; then
              echo "CONFIG $f"
              grep -nE 'admin[.]loongjump[.]com|Permissions-Policy|geolocation|reverse_proxy' "$f" || true
            fi
          done
          REMOTE
